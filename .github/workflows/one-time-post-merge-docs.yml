name: One-time post-merge documentation cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/post-merge-docs-trigger'

permissions:
  contents: write

concurrency:
  group: unoone-post-merge-docs-cleanup
  cancel-in-progress: false

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update merged-main status accurately
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): [
                  (
                      '> **Current status:** active migration on `feature/unoone-v2-gemma4-pageagent` through draft PR #1. This branch is **not production-ready** until every release-blocking gate in this README is complete. The previous `main` state is preserved on `archive/main-pre-unoone-v2-2026-07`.',
                      '> **Current status:** UnoOne V2 was merged into `main` through PR #1 on July 13, 2026. Automated Android and Distribution CI are green. It is **not production-ready** until the physical-device, speech, security, signed-release and production-distribution gates in this README are complete. The previous `main` state remains preserved on `archive/main-pre-unoone-v2-2026-07`.'
                  ),
                  (
                      '- [ ] Make the latest PR head green on every workflow.',
                      '- [x] Automated Android and Distribution CI passed on the merged V2 head.'
                  ),
                  (
                      '- [ ] Update the draft PR checklist from actual evidence.',
                      '- [x] Final automated evidence and known limitations are recorded in the repository.'
                  ),
                  (
                      '- [ ] Merge PR #1 into `main` only after every release-blocking gate passes.',
                      '- [x] Merge PR #1 into `main` after automated repository gates passed; physical-device and production-release gates remain blocked.'
                  ),
                  (
                      '- [ ] Keep the archived pre-V2 branch; do not destroy recoverable history.',
                      '- [x] Keep the archived pre-V2 branch; do not destroy recoverable history.'
                  ),
                  (
                      '- Gemma 4 E2B has integrity metadata but is not yet physically device-qualified in this branch.',
                      '- Gemma 4 E2B has integrity metadata but is not yet physically device-qualified on `main`.'
                  ),
              ],
              Path('STATUS.md'): [
                  ('**Updated:** 2026-07-12  ', '**Updated:** 2026-07-13  '),
                  ('**Branch:** `feature/unoone-v2-gemma4-pageagent`  ', '**Branch:** `main`  '),
                  ('**Pull request:** Draft PR #1  ', '**Pull request:** PR #1 merged  '),
                  ('- **Implemented** — code exists on the V2 branch.', '- **Implemented** — code exists on `main`.'),
                  (
                      '| Android project | Implemented, 15 Gradle modules | latest lint, JVM tests and APK build green |',
                      '| Android project | Implemented, 15 Gradle modules | automated lint, JVM tests and debug APK build are green; physical-device matrix pending |'
                  ),
                  (
                      '| Installer PWA | signed-catalogue flow implemented | latest distribution CI green and production deployment |',
                      '| Installer PWA | signed-catalogue flow implemented | automated Distribution CI is green; production deployment pending |'
                  ),
                  ('- [ ] Latest Android CI is green.', '- [x] Latest Android CI is green.'),
                  ('- [ ] Latest Distribution CI is green.', '- [x] Latest Distribution CI is green.'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify stale branch wording is gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'feature/unoone-v2-gemma4-pageagent' README.md STATUS.md
          ! grep -R --line-number --fixed-strings 'Draft PR #1' README.md STATUS.md
          grep -F 'archive/main-pre-unoone-v2-2026-07' README.md >/dev/null

      - name: Commit docs and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md STATUS.md
          git rm .github/workflows/one-time-post-merge-docs.yml .github/post-merge-docs-trigger
          git commit -m "docs: record merged V2 status and remaining release gates"
          git push origin HEAD:main
