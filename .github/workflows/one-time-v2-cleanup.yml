name: One-time V2 cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/maintenance/cleanup_v2_legacy_literals.py
      - .github/workflows/one-time-v2-cleanup.yml

permissions:
  contents: write

concurrency:
  group: one-time-v2-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact V2 cleanup
        run: python3 scripts/maintenance/cleanup_v2_legacy_literals.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No cleanup changes were required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android-app/UnoOneAgent
            git commit -m "cleanup: remove final legacy brain literals"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Verify remaining cleanup invariants
        id: invariants
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/ci/check_repo_invariants.py 2>&1 | tee remaining-invariants.log

      - name: Upload remaining invariant diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-invariant-diagnostics
          path: remaining-invariants.log
          retention-days: 14

      - name: Enforce remaining cleanup invariants
        if: always()
        run: |
          if [[ "${{ steps.invariants.outcome }}" != "success" ]]; then
            exit 1
          fi
