name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android-app/**'
      - 'web-runtime/page-agent-unoone/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - 'web-runtime/page-agent-unoone/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web-runtime/page-agent-unoone/package.json

      - name: Install PageAgent runtime dependencies
        working-directory: web-runtime/page-agent-unoone
        run: npm install --no-audit --no-fund

      - name: Typecheck PageAgent runtime
        working-directory: web-runtime/page-agent-unoone
        run: npm run typecheck

      - name: Test PageAgent runtime
        working-directory: web-runtime/page-agent-unoone
        run: npm test

      - name: Build PageAgent Android asset
        working-directory: web-runtime/page-agent-unoone
        run: npm run bundle:android

      - name: Verify PageAgent Android asset
        run: test -s android-app/UnoOneAgent/securebrowser/src/main/assets/page-agent/unoone-page-agent.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-app/UnoOneAgent/**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        working-directory: android-app/UnoOneAgent
        run: chmod +x gradlew

      - name: Run Lint
        working-directory: android-app/UnoOneAgent
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Run Unit Tests
        working-directory: android-app/UnoOneAgent
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: android-app/UnoOneAgent/**/build/reports/tests/
          retention-days: 14

      - name: Build Debug APK
        working-directory: android-app/UnoOneAgent
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android-app/UnoOneAgent/app/build/outputs/apk/debug/*.apk
          retention-days: 7
